services:
  - type: web
    name: bg-remover-studio-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CUTOUT_DATA_DIR
        value: ./data
      - key: CUTOUT_CACHE_DIR
        value: ./data/jobs
      - key: JOB_TTL_HOURS
        value: "48"
      - key: GUEST_DAILY_LIMIT
        value: "2"
      - key: GUEST_MAX_DIMENSION
        value: "1024"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: FRONTEND_ORIGINS
        value: https://your-vercel-app.vercel.app
      - key: FRONTEND_URL
        value: https://your-vercel-app.vercel.app
      - key: LOG_LEVEL
        value: INFO
      - key: PBKDF2_ITERATIONS
        value: "210000"
      - key: SESSION_DAYS
        value: "30"
      - key: CUTOUT_DEV_BILLING
        value: "true"
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: STRIPE_PRICE_PRO_MONTHLY
        value: ""
      - key: STRIPE_PRICE_PRO_YEARLY
        value: ""
      - key: STRIPE_PRICE_BUSINESS_MONTHLY
        value: ""
      - key: STRIPE_PRICE_BUSINESS_YEARLY
        value: ""
