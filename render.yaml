services:
  - type: web
    name: bg-remover-studio-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CUTOUT_DATA_DIR
        value: ./data
      - key: CUTOUT_CACHE_DIR
        value: ./data/jobs
      - key: JOB_TTL_HOURS
        value: "48"
      - key: GUEST_DAILY_LIMIT
        value: "2"
      - key: GUEST_MAX_DIMENSION
        value: "1024"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      - key: PBKDF2_ITERATIONS
        value: "210000"
      - key: SESSION_DAYS
        value: "30"
      - key: CUTOUT_DEV_BILLING
        value: "true"

  - type: static
    name: bg-remover-studio
    rootDir: frontend
    buildCommand: npm ci && VITE_API_URL="https://${BACKEND_HOST}" npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: bg-remover-studio-api
          property: host
